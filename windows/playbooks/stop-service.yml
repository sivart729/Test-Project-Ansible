---
- name: Stop a service and get disk size
  hosts: all
  collections:
    - community.windows
  serial: 1
  gather_facts: false
  vars:
    service: "spooler"
  tasks:
  - name: "Stop {{ service }} service"
    win_service:
      name: "{{ service }}"
      start_mode: auto
      state: stopped
      
