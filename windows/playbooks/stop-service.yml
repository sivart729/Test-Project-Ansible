---
- name: Stop a service and get disk size
  hosts: all
  collections:
    - community.windows
  serial: 1
  gather_facts: false
  vars:
    service: "spooler"
  tasks:
  - name: "Stop {{ service }} service"
    win_service:
      name: "{{ service }}"
      start_mode: auto
      state: stopped

  - name: Get all disk facts
    community.windows.win_disk_facts:

  - name: Output the first disk size
    debug:
      var: ansible_facts.disks[0].size

  - name: Make the first system disk size human-readable
    debug:
      msg: '{{ disksize_gb }} vs. {{ disksize_gb_human }}'
    vars:
      disk: '{{ ansible_facts.disks|selectattr("system_disk")|first }}'
      disksize_gb_human: '{{ disk.size|filesizeformat }}'
      disksize_gb: '{{ (disk.size/1000|pow(3))|round|int }}'
